name: data-explorer-app

services:
  - name: frontend
    source_dir: data-explorer-frontend
    github:
      branch: main
      deploy_on_push: true
    build_command: npm install --legacy-peer-deps && npm run build
    run_command: npm run start
    environment_slug: node-20
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: GROQ_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: PLACEHOLDER
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

  - name: backend
    source_dir: analytics_agent
    github:
      branch: main
      deploy_on_push: true
    build_command: pip install -r requirements.txt
    run_command: uvicorn main:app --host 0.0.0.0 --port 8080
    environment_slug: python-3.11
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    routes:
      - path: /api
